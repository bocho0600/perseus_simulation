[workspace]
name = "perseus-simulation"
version = "0.0.1"
description = "Perseus V2 rover Gazebo simulation (ROS 2 Jazzy), managed with pixi"
authors = ["Perseus team"]
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
# RoboStack installs Gazebo's ROS integration into the conda prefix, but it
# does not point Gazebo's search paths there. Without these, Gazebo cannot load
# the gz_ros2_control system plugin (so no controller_manager starts) and cannot
# resolve `model://` meshes such as realsense2_description. The nix devshell
# used to provide the equivalent paths.
[activation.env]
GZ_SIM_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib"
GZ_SIM_RESOURCE_PATH = "$CONDA_PREFIX/share"
# `gz` is a Ruby CLI that discovers its subcommands from the yaml files in
# GZ_CONFIG_PATH -- `gz sim` exists only because $CONDA_PREFIX/share/gz/sim8.yaml
# does. Unlike the two paths above, this one is inherited rather than set, so a
# value from the outer shell wins. The perseus-v3 devenv exports
#
#   GZ_CONFIG_PATH=/nix/store/...-ros-jazzy-gz-cmake-vendor-.../share/gz:
#                  /nix/store/...-ros-env/share/gz
#
# and neither directory ships sim8.yaml (the ros-env has only sdformat14.yaml).
# `eval "$(devenv hook bash)"` in ~/.bashrc enters that shell on `cd`, so running
# `pixi run sim` from a terminal that has visited perseus-v3 poisons the variable.
# `gz sim` is then an unknown subcommand: gz prints its usage text and exits 255
# about 70 ms in, before the "Gazebo Sim Server" banner. Nothing else notices --
# what you see is ros_gz_sim repeating "Requesting list of world names." forever
# and the controller spawners never finding /controller_manager, the same
# symptom as the Ruby gem leak described in scripts/pixi-run.sh.
# Setting it here overwrites whatever the outer shell had.
GZ_CONFIG_PATH = "$CONDA_PREFIX/share/gz"

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
# The whole workflow is driven through pixi:
#   pixi run build    # build the colcon workspace
#   pixi run sim      # build (incrementally) + launch the Gazebo simulation
#   pixi run teleop   # drive the rover with the keyboard (second terminal)
#   pixi run clean    # remove colcon build artifacts
[tasks.fetch-deps]
description = "Clone third-party ROS packages not published on RoboStack"
# twist_stamper is a small pure-python node used by the twist_mux launch file
# but is not available on the robostack-jazzy channel, so we build it from
# source inside the workspace.
cmd = "test -d src/twist_stamper || git clone --depth 1 https://github.com/joshnewans/twist_stamper.git src/twist_stamper"

[tasks.build]
description = "Build the ROS 2 workspace with colcon"
depends-on = ["fetch-deps"]
# scripts/pixi-run.sh strips any leaked system ROS (/opt/ros/*) so it cannot be
# mixed with the RoboStack build (which crashes Gazebo with heap corruption).
cmd = "bash scripts/pixi-run.sh colcon build --symlink-install --event-handlers console_direct+"

[tasks.sim]
description = "Build and launch the Perseus Gazebo simulation"
depends-on = ["build"]
# `"$@"` plus the trailing `--` forward anything after `pixi run sim` on to
# `ros2 launch`, so `pixi run sim payload:=none` works. Without them pixi
# appends the extra args to the OUTER command line, where they become
# positional args of `bash -c` ($0, $1, ...) and are silently dropped: the sim
# comes up with defaults and nothing warns you. The `--` takes $0 so the first
# real argument lands in $1, where "$@" picks it up.
cmd = "bash scripts/pixi-run.sh bash -c 'source install/setup.bash && ros2 launch perseus_simulation perseus_sim.launch.py \"$@\"' --"

[tasks.teleop]
description = "Drive the rover with the keyboard (run in a second terminal)"
cmd = "bash scripts/pixi-run.sh bash -c 'source install/setup.bash && ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true --remap cmd_vel:=/cmd_vel_out'"
[tasks.clean]
description = "Remove colcon build/install/log artifacts"
cmd = "rm -rf build install log"

# ---------------------------------------------------------------------------
# Dependencies (from robostack-jazzy + conda-forge)
# ---------------------------------------------------------------------------
[dependencies]
# ROS 2 Jazzy base + build tooling
ros-jazzy-desktop = "*"
ros-jazzy-ros2launch = "*"
ros-jazzy-ament-cmake = "*"
colcon-common-extensions = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
cxx-compiler = "*"
c-compiler = "*"
python = "*"
git = "*"

# Simulation / Gazebo bridge
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-ros-gz-image = "*"
ros-jazzy-ros-gz-interfaces = "*"
ros-jazzy-gz-ros2-control = "*"

# ros2_control
ros-jazzy-controller-manager = "*"
ros-jazzy-diff-drive-controller = "*"
ros-jazzy-mecanum-drive-controller = "*"
ros-jazzy-joint-state-broadcaster = "*"
# bucket controllers (perseus_simulation/config/bucket_controllers.yaml)
ros-jazzy-joint-trajectory-controller = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-xacro = "*"

# Nodes used by the simulation launch files
ros-jazzy-robot-localization = "*"
ros-jazzy-rosbridge-suite = "*"
ros-jazzy-twist-mux = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-realsense2-description = "*"
ros-jazzy-joint-state-publisher-gui = "*"
