# partially taken from Articubot One project by Articulated Robotics
# see: https://github.com/joshnewans/articubot_one/tree/new_gazebo
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
- ros_topic_name: "gazebo_odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
# 2D lidar: no Gazebo sensor is instantiated (see sensors.urdf.xacro), so there is
# nothing to bridge on "scan".
# 3D lidar
- ros_topic_name: "scan_3d"
  gz_topic_name: "scan_3d"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
# ─── RealSense D455 ──────────────────────────────────────────────────────────
# Every camera entry is lazy: the bridge only subscribes to the gz topic once a
# ROS subscriber appears. That is what makes always_on false in
# camera_d455_gazebo.xacro actually pay off - a non-lazy bridge is itself a
# subscriber, so gz renders all four sensors forever whether or not anything
# consumes them. Measured on this world with the rover spawned:
#
#     no cameras at all                        RTF 0.98   Livox 9.8 Hz
#     4 cameras, always_on true                RTF 0.395  Livox 3.87 Hz
#     always_on false, bridge NOT lazy         RTF 0.657  Livox 7.07 Hz
#
# Re-enabled alongside xacro:camera_d455_gazebo. vision/aruco_detector reads
# /camera/camera/color/image_raw and, with use_camera_info true, the matching
# camera_info; cube_detector reads aligned_depth_to_color. The infra1/infra2
# pairs are bridged for parity with the real driver's topic set, but nothing
# currently subscribes to them.
# ─── RGB Color Camera ───────────────────────────────────────────────────────
- ros_topic_name: "/camera/camera/color/image_raw"
  gz_topic_name: "/camera/camera/color/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: "/camera/camera/color/camera_info"
  gz_topic_name: "/camera/camera/color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true
# ─── Depth Camera ────────────────────────────────────────────────────────────
# No depth at all any more. The standalone depth_camera sensor is gone, and the
# colour sensor is a plain camera rather than an rgbd_camera, so there is no
# aligned_depth_to_color either. See camera_d455_gazebo.xacro.
# ─── Infra1 (Left IR) ────────────────────────────────────────────────────────
- ros_topic_name: "/camera/camera/infra1/image_raw"
  gz_topic_name: "/camera/camera/infra1/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: "/camera/camera/infra1/camera_info"
  gz_topic_name: "/camera/camera/infra1/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true
# ─── Infra2 (Right IR) ───────────────────────────────────────────────────────
- ros_topic_name: "/camera/camera/infra2/image_raw"
  gz_topic_name: "/camera/camera/infra2/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: "/camera/camera/infra2/camera_info"
  gz_topic_name: "/camera/camera/infra2/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true
# ─── Livox MID-360 ───────────────────────────────────────────────────────────
- ros_topic_name: "/livox/lidar"
  gz_topic_name: "/scan_3d/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
- ros_topic_name: "/livox/imu"
  gz_topic_name: "/scan_3d/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
# ─── Excavation bucket ───────────────────────────────────────────────────────
# Absolute joint angles in radians, consumed by the two
# gz::sim::systems::JointPositionController instances declared in
# perseus_description/urdf/bucket.urdf.xacro. The bucket joints are not
# ros2_control joints (the real robot drives them over CAN, not through
# controller_manager), so this is how the simulated bucket is commanded:
#   ros2 topic pub /bucket/lift/cmd_pos std_msgs/msg/Float64 "{data: -0.4}"
#   ros2 topic pub /bucket/tilt/cmd_pos std_msgs/msg/Float64 "{data: 0.8}"
# Their positions come back on /joint_states via the `joint_state` entry above.
- ros_topic_name: "/bucket/lift/cmd_pos"
  gz_topic_name: "/bucket/lift/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/bucket/tilt/cmd_pos"
  gz_topic_name: "/bucket/tilt/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
# Ram followers. bucket_ram_follower solves the ram angle and extension in
# closed form from the lift/tilt joint angles and publishes them here; the
# Gazebo position controllers in bucket.urdf.xacro consume them. Both lift rams
# listen on the same pair, so four numbers drive all six ram joints.
- ros_topic_name: "/bucket/ram_lift/cmd_angle"
  gz_topic_name: "/bucket/ram_lift/cmd_angle"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/bucket/ram_lift/cmd_extend"
  gz_topic_name: "/bucket/ram_lift/cmd_extend"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/bucket/ram_tilt/cmd_angle"
  gz_topic_name: "/bucket/ram_tilt/cmd_angle"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/bucket/ram_tilt/cmd_extend"
  gz_topic_name: "/bucket/ram_tilt/cmd_extend"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
